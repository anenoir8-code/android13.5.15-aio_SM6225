name: "Build Kernel - Sapphire/n"

env:
  OUT_DIR: "out"

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      is_testing:
        description: "Testing Build?"
        type: boolean
        default: false

permissions:
  contents: write

jobs:

  # record global start time
  setup:
    name: "⏱️ Setup"
    runs-on: ubuntu-latest
    outputs:
      start_time: ${{ steps.ts.outputs.start_time }}
    steps:
      - name: "Record start time"
        id: ts
        run: echo "start_time=$(date +%s)" >> $GITHUB_OUTPUT

      - name: "📣 Send Telegram — Build started"
        run: |
          TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "${{ inputs.is_testing }}" = "true" ]; then
            BUILD_TYPE="🧪 Testing Build"
          else
            BUILD_TYPE="🧩 Stable Build"
          fi
          MESSAGE="<b>🔨 Kernel Build Started</b>%0A%0A"
          MESSAGE="${MESSAGE}<b>📦 Type:</b> ${BUILD_TYPE}%0A"
          MESSAGE="${MESSAGE}<b>📱 Device:</b> Redmi Note 13 4G (sapphire/n)%0A"
          MESSAGE="${MESSAGE}<b>📁 Repository:</b> ${{ github.repository }}%0A"
          MESSAGE="${MESSAGE}<b>🔄 Trigger:</b> ${{ github.event_name }}%0A"
          MESSAGE="${MESSAGE}<b>🆔 Run:</b> #${{ github.run_number }}%0A"
          MESSAGE="${MESSAGE}<b>⏰ Started:</b> $(TZ='UTC' date +'%Y-%m-%d %H:%M UTC')%0A"
          MESSAGE="${MESSAGE}<b>📝 Logs:</b> <a href='${RUN_URL}'>View</a>"
          curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
            -d chat_id="$CHAT_ID" \
            -d text="$MESSAGE" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview=true || true

  # matrix build
  build-kernels:
    name: "🔨 Build ${{ matrix.kernel.name }}"
    runs-on: ubuntu-latest
    needs: [setup]
    strategy:
      fail-fast: false
      matrix:
        kernel:
          # GKI + Wild-KSU
          - name: "GKI-KSU"
            dir: "common_gki"
            repo_name: "common"
            repo_url: "https://android.googlesource.com/kernel/common"
            branch: "android13-5.15-lts"
            config_branch: "android13-5.15"
            defconfig: "gki_defconfig"
            output_name: "Image.gki.ksu"
            artifact_name: "gki-ksu-kernel"
            zip_prefix: "GKI_KSU"
            ksu_type: "wild"

          # CLO + Wild-KSU
          - name: "CLO-KSU"
            dir: "common_clo"
            repo_name: "clo"
            repo_url: "https://git.codelinaro.org/clo/la/kernel/msm-5.15.git"
            branch: "kernel.lnx.5.15.r59-rel"
            config_branch: "android13-5.15"
            defconfig: "gki_defconfig"
            output_name: "Image.clo.ksu"
            artifact_name: "clo-ksu-kernel"
            zip_prefix: "CLO_KSU"
            ksu_type: "wild"

          # GKI vanilla
          - name: "GKI-NoKSU"
            dir: "common_gki_noksu"
            repo_name: "common"
            repo_url: "https://android.googlesource.com/kernel/common"
            branch: "android13-5.15-lts"
            config_branch: "android13-5.15"
            defconfig: "gki_defconfig"
            output_name: "Image.gki.noksu"
            artifact_name: "gki-noksu-kernel"
            zip_prefix: "GKI_NoKSU"
            ksu_type: "none"

          # CLO vanilla
          - name: "CLO-NoKSU"
            dir: "common_clo_noksu"
            repo_name: "clo"
            repo_url: "https://git.codelinaro.org/clo/la/kernel/msm-5.15.git"
            branch: "kernel.lnx.5.15.r59-rel"
            config_branch: "android13-5.15"
            defconfig: "gki_defconfig"
            output_name: "Image.clo.noksu"
            artifact_name: "clo-noksu-kernel"
            zip_prefix: "CLO_NoKSU"
            ksu_type: "none"

    env:
      KERNEL_LOC_DIR: ${{ matrix.kernel.dir }}
      KERNEL_NAME: ${{ matrix.kernel.repo_name }}
      KERNEL_REPO: ${{ matrix.kernel.repo_url }}
      KERNEL_BRANCH: ${{ matrix.kernel.branch }}
      DEFCONFIG_NAME: ${{ matrix.kernel.defconfig }}
      WORK_DIR: ${{ github.workspace }}

    steps:

      - name: "📦 Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "🛠️ Setup workspace"
        run: |
          mkdir -p ${{ env.KERNEL_LOC_DIR }}
          echo "BUILD_TIME=$(date +'%Y-%m-%d %H:%M')" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV
          sudo apt-get update -qq
          sudo apt-get install -y repo rsync aria2 bc bison build-essential flex git libelf-dev libssl-dev curl jq

      - name: "🧹 Free disk space"
        run: |
          sudo apt-get remove -y \
            '^dotnet-.*' '^llvm-.*' '^php.*' '^mongodb.*' \
            azure-cli google-cloud-cli google-chrome-stable \
            firefox powershell mono-devel snapd \
            libgl1-mesa-dri 2>/dev/null || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell \
            /usr/share/swift \
            /usr/local/.ghcup \
            /usr/lib/jvm \
            "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          df -h /

      - name: "📐 Setup SWAP 12GB"
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: "📐 Tune Swap"
        run: |
          echo "vm.swappiness=80" | sudo tee -a /etc/sysctl.conf
          sudo sysctl -p

      - name: "🌟 Clone kernel source"
        working-directory: ./${{ env.KERNEL_LOC_DIR }}
        run: |
          git clone --recursive --branch ${{ env.KERNEL_BRANCH }} \
            ${{ env.KERNEL_REPO }} ${{ env.KERNEL_NAME }} --depth=1

      - name: "📥 Initialize AOSP repo and toolchains"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android13-5.15-lts --depth=1
          repo sync --optimized-fetch --prune --no-clone-bundle --no-tags -j$(nproc --all)

          rm -rf .repo
          rm -rf common

          aria2c -x 16 -s 16 -o prebuilts/clang/host/linux-x86/clang-r547379.tar.gz \
            "https://github.com/topnotchfreaks/clang/releases/download/v1.0.0/clang-r547379.tar.gz"
          mkdir -p prebuilts/clang/host/linux-x86/clang-r547379
          tar -xzf prebuilts/clang/host/linux-x86/clang-r547379.tar.gz \
            -C prebuilts/clang/host/linux-x86/clang-r547379
          rm -rf prebuilts/clang/host/linux-x86/clang-r547379.tar.gz

          rm -rf prebuilts/clang/host/linux-x86/clang-3289846
          rm -rf prebuilts/clang/host/linux-x86/clang-r450784e
          rm -rf prebuilts/clang/host/linux-x86/clang-stable

          sed -i \
            -e 's/^BRANCH=.*/BRANCH=${{ matrix.kernel.config_branch }}/' \
            -e 's/^CLANG_VERSION=.*/CLANG_VERSION=r547379/' \
            ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.constants

          sed -i '/^POST_DEFCONFIG_CMDS="check_defconfig"/d' \
            ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki || true

      - name: "🛡️ Setup Baseband-guard (BBG)"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          git clone -q --depth=1 https://github.com/vc-teahouse/Baseband-guard.git
          ln -sf ../Baseband-guard security/baseband-guard

          grep -q "baseband-guard" security/Makefile || \
            echo 'obj-$(CONFIG_BBG) += baseband-guard/' >> security/Makefile

          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' \
            security/Kconfig

          grep -q "baseband-guard/Kconfig" security/Kconfig || \
            sed -i '/source "security\/keys\/Kconfig"/a source "security/baseband-guard/Kconfig"' \
            security/Kconfig

      - name: "🩹 Fix BBG get_link (bbg_fix_get_link)"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          curl -LSs "https://raw.githubusercontent.com/WildKernels/kernel_patches/refs/heads/main/experimental/bbg/bbg_fix_get_link.patch" \
            -o /tmp/bbg_fix_get_link.patch
          if patch -p1 --forward < /tmp/bbg_fix_get_link.patch; then
            echo "✅ bbg_fix_get_link applied"
          else
            echo "⚠️ bbg_fix_get_link had issues (may already be applied), continuing..."
          fi

      # wild-ksu + susfs setup
      - name: "😋 Setup Wild-KSU with SUSFS"
        if: matrix.kernel.ksu_type == 'wild'
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          set -e

          rm -rf ./KernelSU ./drivers/kernelsu ./Wild_KSU

          curl -LSs "https://raw.githubusercontent.com/WildKernels/Wild_KSU/wild/kernel/setup.sh" | bash -s canary

          if [ ! -d "Wild_KSU" ]; then
            echo "ERROR: Wild_KSU directory not found!"
            exit 1
          fi

          # extract wild-ksu version
          cd Wild_KSU
          KSU_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "unknown")
          echo "WILD_KSU_TAG=$KSU_TAG" >> $GITHUB_ENV
          echo "$KSU_TAG" > ${{ env.WORK_DIR }}/wild_ksu_tag.txt
          echo "-- Wild KSU tag: $KSU_TAG"
          cd ..

          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android13-5.15

          SUSFS_PATCH="susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch"
          if [ -f "$SUSFS_PATCH" ]; then
            patch -p1 --forward < "$SUSFS_PATCH" || echo "⚠️ patch had issues, continuing..."
          fi

          mkdir -p fs include/linux
          cp -f susfs4ksu/kernel_patches/fs/* fs/
          cp -f susfs4ksu/kernel_patches/include/linux/* include/linux/

          if [ -d "susfs4ksu/kernel_patches/KernelSU/kernel" ]; then
            cp -rf susfs4ksu/kernel_patches/KernelSU/kernel/* Wild_KSU/kernel/ || true
          fi

          KSU_C_FILE="Wild_KSU/kernel/ksu.c"
          if ! grep -q "susfs_init" "$KSU_C_FILE" 2>/dev/null; then
            grep -q "#include <linux/susfs.h>" "$KSU_C_FILE" || \
              sed -i '/#include <linux\/fs\.h>/a #include <linux/susfs.h>' "$KSU_C_FILE"
            grep -q "susfs_init()" "$KSU_C_FILE" || \
              sed -i '/ksu_core_init();/a \\tsusfs_init();' "$KSU_C_FILE" || \
              sed -i '/int __init ksu_init(/,/^}/{ /return 0;/i \\tsusfs_init(); }' "$KSU_C_FILE"
          fi

          [ ! -L "drivers/kernelsu" ] && [ ! -d "drivers/kernelsu" ] && \
            ln -sf ../Wild_KSU drivers/kernelsu

          rm -rf susfs4ksu

      # fix susfs symbol mismatches
      - name: "🔧 Fix SUSFS compatibility stubs"
        if: matrix.kernel.ksu_type == 'wild'
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          set -e
          SUSFS_C="fs/susfs.c"
          SUSFS_H="include/linux/susfs.h"
          SETUID_HOOK="drivers/kernelsu/setuid_hook.c"
          SUPERCALLS="drivers/kernelsu/supercalls.c"

          add_stub_c() {
            local func="$1" signature="$2" body="$3"
            if ! grep -q "$func" "$SUSFS_C" 2>/dev/null; then
              printf "\n/* stub: %s */\n%s\n{\n\t%s\n}\n" "$func" "$signature" "$body" >> "$SUSFS_C"
            fi
          }

          add_stub_h() {
            local func="$1" decl="$2"
            grep -q "$func" "$SUSFS_H" 2>/dev/null || sed -i "/^#endif/i $decl" "$SUSFS_H"
          }

          # susfs_reorder_mnt_id
          if grep -q "susfs_reorder_mnt_id" "$SETUID_HOOK" 2>/dev/null; then
            add_stub_c "susfs_reorder_mnt_id" \
              "void susfs_reorder_mnt_id(struct task_struct *task)" "return;"
            add_stub_h "susfs_reorder_mnt_id" \
              "void susfs_reorder_mnt_id(struct task_struct *task);"
          fi

          # susfs_set_i_state_on_external_dir
          if grep -q "susfs_set_i_state_on_external_dir" "$SUPERCALLS" 2>/dev/null; then
            add_stub_c "susfs_set_i_state_on_external_dir" \
              "void susfs_set_i_state_on_external_dir(struct inode *inode)" "return;"
            add_stub_h "susfs_set_i_state_on_external_dir" \
              "void susfs_set_i_state_on_external_dir(struct inode *inode);"
            grep -q "#include <linux/susfs.h>" "$SUPERCALLS" 2>/dev/null || \
              sed -i '/#include <linux\/fs\.h>/a #include <linux/susfs.h>' "$SUPERCALLS"
            sed -i 's/susfs_set_i_state_on_external_dir(arg)/susfs_set_i_state_on_external_dir((struct inode \*)arg)/g' "$SUPERCALLS"
          fi

      - name: "🩹 Apply SUSFS dentry null checks"
        if: matrix.kernel.ksu_type == 'wild'
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          curl -LSs "https://raw.githubusercontent.com/WildKernels/kernel_patches/refs/heads/main/experimental/susfs/susfs_dentry_checks.patch" \
            -o /tmp/susfs_dentry_checks.patch
          if patch -p1 --forward < /tmp/susfs_dentry_checks.patch; then
            echo "✅ susfs_dentry_checks applied"
          else
            echo "⚠️ susfs_dentry_checks had issues (may already be applied), continuing..."
          fi

      - name: "🩹 Apply wild SUSFS v2.0.0 a13-5.15 fixes"
        if: matrix.kernel.ksu_type == 'wild'
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          BASE_URL="https://raw.githubusercontent.com/WildKernels/kernel_patches/refs/heads/main/wild/susfs_fix_patches/v2.0.0/a13-5.15"
          for patch_name in fdinfo.c.patch namespace.c.patch open.c.patch; do
            echo "--- Applying $patch_name ---"
            curl -LSs "${BASE_URL}/${patch_name}" -o "/tmp/${patch_name}"
            if patch -p1 --forward < "/tmp/${patch_name}"; then
              echo "✅ $patch_name applied"
            else
              echo "⚠️ $patch_name had issues (may already be applied), continuing..."
            fi
          done

      # gki fixup patches
      - name: "🩹 Apply GKI fixup patches"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          # io-channel fix skipped — breaks dwc3-msm-core + fuel gauge (sapphire/sapphiren)
          DWC3_CORE="drivers/usb/dwc3/core.c"
          DWC3_GADGET="drivers/usb/dwc3/gadget.c"
          DWC3_HEADER="drivers/usb/dwc3/core.h"

          if [ -f "$DWC3_GADGET" ]; then
            sed -i '/dwc3_core_soft_reset(dwc);/{N; /dwc3_event_buffers_setup(dwc);/{d}}' "$DWC3_GADGET"
            sed -i '/^\s*dwc3_core_soft_reset(dwc);\s*$/d' "$DWC3_GADGET"
          fi
          if [ -f "$DWC3_CORE" ]; then
            grep -q "static int dwc3_core_soft_reset" "$DWC3_CORE" || \
              sed -i '/^static void __dwc3_set_mode/i static int dwc3_core_soft_reset(struct dwc3 *dwc);' "$DWC3_CORE"
            sed -i 's/^int dwc3_core_soft_reset(struct dwc3 \*dwc)$/static int dwc3_core_soft_reset(struct dwc3 *dwc)/' "$DWC3_CORE"
          fi
          [ -f "$DWC3_HEADER" ] && \
            sed -i '/^int dwc3_core_soft_reset(struct dwc3 \*dwc);$/d' "$DWC3_HEADER"

      - name: "⚡ Apply common optimization patches"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          BASE_URL="https://raw.githubusercontent.com/WildKernels/kernel_patches/refs/heads/main/common"

          declare -A PATCHES=(
            ["unicode_bypass_fix_6.1-.patch"]="fs/unicode/utf8-norm.c — fix UTF-8 zero-width decompose crash"
            ["silence_irq_cpu_logspam.patch"]="kernel/irq/cpuhotplug.c — silence IRQ affinity logspam"
            ["silence_system_logspam.patch"]="kernel/printk/printk.c — silence healthd/logd/dashd spam"
            ["reduce_cache_pressure.patch"]="fs/dcache.c — vfs_cache_pressure 100→50"
            ["mem_opt_prefetch.patch"]="arch/arm64/lib/copy_template.S — prefetch optimization"
          )

          for patch_name in \
            "unicode_bypass_fix_6.1-.patch" \
            "silence_irq_cpu_logspam.patch" \
            "silence_system_logspam.patch" \
            "reduce_cache_pressure.patch" \
            "mem_opt_prefetch.patch" \
            "minimise_wakeup_time.patch" \
            "reduce_freeze_timeout.patch" \
            "int_sqrt.patch" \
            "increase_sk_mem_packets.patch" \
            "file_struct_8bytes_align.patch" \
            "clear_page_16bytes_align.patch" \
            "avoid_extra_s2idle_wake_attempts.patch" \
            "adjust_cpu_scan_order.patch" \
            "increase_ext4_default_commit_age.patch"; do
            echo "--- Applying $patch_name ---"
            curl -LSs "${BASE_URL}/${patch_name}" -o "/tmp/${patch_name}"
            if patch -p1 --forward < "/tmp/${patch_name}"; then
              echo "✅ $patch_name applied"
            else
              echo "⚠️ $patch_name had issues (may already be applied), continuing..."
            fi
          done

      # suppress vendor module debug spam
      - name: "🔇 Suppress vendor module debugging"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          cat > /tmp/vendor_debug.py << 'PYEOF'
          import sys

          with open("init/Kconfig") as f:
              k = f.read()
          if "SUPPRESS_VENDOR_MODULE_DEBUGGING" not in k:
              entry = (
                  "\nconfig SUPPRESS_VENDOR_MODULE_DEBUGGING\n"
                  "\tbool \"Suppress vendor module debugging\"\n"
                  "\thelp\n"
                  "\t  Suppress vendor GKI module debug spam. Xiaomi-specific. If unsure, say N.\n"
              )
              k = k.replace("endif # MODULES", entry + "endif # MODULES")
              open("init/Kconfig", "w").write(k)
              print("Kconfig: patched")
          else:
              print("Kconfig: skip")

          with open("kernel/printk/printk.c") as f:
              c = f.read()
          if "should_filter_vendor_message" not in c:
              func = (
                  "\n__maybe_unused static bool should_filter_vendor_message(const char *text)\n"
                  "{\n"
                  "\tconst char *const *module;\n"
                  "\tstatic const char *const fm[] = {\n"
                  "\t\t\"[bq25\", \"[sm56\", \"nopmi\", \"[sc85\",\n"
                  "\t\t\"st21n\", \"[Awin\", \"qpnp_\",\n"
                  "\t\t\"(virq\", \"(ipi:\", \"(cpu:\",\n"
                  "\t\tNULL\n"
                  "\t};\n"
                  "\tfor (module = fm; likely(*module); module++) {\n"
                  "\t\tif (strstr(text, *module))\n"
                  "\t\t\treturn true;\n"
                  "\t}\n"
                  "\treturn false;\n"
                  "}\n\n"
              )
              hook = (
                  "\tva_end(args2);\n\n"
                  "#if IS_ENABLED(CONFIG_SUPPRESS_VENDOR_MODULE_DEBUGGING)\n"
                  "\tif (should_filter_vendor_message(prefix_buf)) {\n"
                  "\t\tret = 0;\n"
                  "\t\tgoto out;\n"
                  "\t}\n"
                  "#endif\n\n"
              )
              c = c.replace("\n__printf(4, 0)\nint vprintk_store", func + "__printf(4, 0)\nint vprintk_store")
              c = c.replace(
                  "\tva_end(args2);\n\n\tif (reserve_size > LOG_LINE_MAX)",
                  hook + "\tif (reserve_size > LOG_LINE_MAX)"
              )
              open("kernel/printk/printk.c", "w").write(c)
              print("printk.c: patched")
          else:
              print("printk.c: skip")
          PYEOF

          python3 /tmp/vendor_debug.py
          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          grep -q "CONFIG_SUPPRESS_VENDOR_MODULE_DEBUGGING" "$CONFIG_FILE" || \
            echo "CONFIG_SUPPRESS_VENDOR_MODULE_DEBUGGING=y" >> "$CONFIG_FILE"

      # base configs
      - name: "⚙️ Add base kernel configs"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          sed 's/^[[:space:]]*//' >> "$CONFIG_FILE" << 'EOF'
          CONFIG_KALLSYMS=y
          CONFIG_OVERLAY_FS_REDIRECT_DIR=y
          CONFIG_OVERLAY_FS_REDIRECT_ALWAYS_FOLLOW=y
          CONFIG_OVERLAY_FS_INDEX=y
          CONFIG_OVERLAY_FS_XINO_AUTO=y
          CONFIG_OVERLAY_FS_METACOPY=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_TCP_CONG_WESTWOOD=y
          CONFIG_TCP_CONG_BIC=n
          CONFIG_TCP_CONG_HTCP=n
          CONFIG_DEFAULT_WESTWOOD=y
          CONFIG_IP_NF_TARGET_TTL=y
          CONFIG_IP6_NF_TARGET_HL=y
          CONFIG_IP6_NF_MATCH_HL=y
          CONFIG_IP_SET=y
          CONFIG_IP_SET_MAX=65534
          CONFIG_IP_SET_BITMAP_IP=y
          CONFIG_IP_SET_BITMAP_IPMAC=y
          CONFIG_IP_SET_BITMAP_PORT=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_IPMARK=y
          CONFIG_IP_SET_HASH_IPPORT=y
          CONFIG_IP_SET_HASH_IPPORTIP=y
          CONFIG_IP_SET_HASH_IPPORTNET=y
          CONFIG_IP_SET_HASH_IPMAC=y
          CONFIG_IP_SET_HASH_MAC=y
          CONFIG_IP_SET_HASH_NETPORTNET=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_IP_SET_HASH_NETNET=y
          CONFIG_IP_SET_HASH_NETPORT=y
          CONFIG_IP_SET_HASH_NETIFACE=y
          CONFIG_IP_SET_LIST_SET=y
          CONFIG_ZRAM_WRITEBACK=y
          CONFIG_ZRAM_MEMORY_TRACKING=y
          CONFIG_LRU_GEN_ENABLED=y
          CONFIG_NET_SCH_FQ=y
          CONFIG_NET_SCH_CAKE=y
          CONFIG_TCP_CONG_VEGAS=y
          CONFIG_TCP_CONG_YEAH=y
          CONFIG_TCP_CONG_VENO=y
          CONFIG_BTRFS_FS=y
          CONFIG_NTFS3_FS=y
          EOF

      # wild-ksu + susfs configs
      - name: "⚙️ Add Wild-KSU + SUSFS kernel configs"
        if: matrix.kernel.ksu_type == 'wild'
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          sed 's/^[[:space:]]*//' >> "$CONFIG_FILE" << 'EOF'
          # ksu
          CONFIG_KSU=y
          # susfs
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_SU=y
          EOF

      - name: "🏷️ Configure kernel name and remove dirty"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          CURRENT_TIME=$(date -u +"%a %b %d %H:%M:%S UTC %Y")
          RANDOM_HASH=$(openssl rand -hex 6)
          sed -i "\$s|echo \"\\\$res\"|echo \"\\\$res-ab${RANDOM_HASH}\"|" ./scripts/setlocalversion
          perl -pi -e "s{UTS_VERSION=\"\\\$\(echo \\\$UTS_VERSION \\\$CONFIG_FLAGS \\\$TIMESTAMP \\| cut -b -\\\$UTS_LEN\)\"}{UTS_VERSION=\"#1 SMP PREEMPT $CURRENT_TIME\"}" \
            ./scripts/mkcompile_h
          sed -i 's/-dirty//' ./scripts/setlocalversion
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add . && git commit -m "clean dirty flag" || true

      - name: "🔩 Fix ABI and build configs"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          if [ -f "build/abi/compare_to_symbol_list" ]; then
            mv build/abi/compare_to_symbol_list build/abi/compare_to_symbol_list.disabled
          fi
          cat > build/abi/compare_to_symbol_list << 'EOF'
          #!/bin/bash
          echo "ABI checking disabled"
          exit 0
          EOF
          chmod +x build/abi/compare_to_symbol_list

          sed -i 's/BUILD_SYSTEM_DLKM=1/BUILD_SYSTEM_DLKM=0/' \
            ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki.aarch64
          sed -i '/MODULES_ORDER=android\/gki_aarch64_modules/d' \
            ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki.aarch64
          sed -i '/KMI_SYMBOL_LIST_STRICT_MODE/d' \
            ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki.aarch64

      - name: "🚀 Build kernel"
        id: build
        working-directory: ${{ env.WORK_DIR }}
        timeout-minutes: 45
        run: |
          set -e
          echo "🚀 Starting kernel build with $(nproc) cores..."

          if [ "${{ inputs.is_testing }}" = "true" ]; then
            export LTO=thin
            echo "🧪 Testing build: LTO=thin (faster)"
          else
            export LTO=full
            echo "🧩 Stable build: LTO=full (optimized)"
          fi

          export KCFLAGS="-O3 -pipe -fno-strict-aliasing -Wno-error"
          echo "KCFLAGS: $KCFLAGS"
          export SKIP_ABI_CHECKS=1
          export SKIP_KMI_CHECK=1

          START_BUILD=$(date +%s)

          if ! KCFLAGS="$KCFLAGS" LLVM_PARALLEL_LINK_JOBS=1 BUILD_CONFIG=${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki.aarch64 \
            build/build.sh -j$(nproc); then
            exit 1
          fi

          END_BUILD=$(date +%s)
          DURATION=$((END_BUILD - START_BUILD))
          echo "✅ Build completed in $((DURATION / 60))m $((DURATION % 60))s"
          echo "duration=$DURATION" >> $GITHUB_OUTPUT

      - name: "🔍 Verify kernel version"
        working-directory: ${{ env.WORK_DIR }}/out/dist
        run: |
          VERSION_FULL=$(strings Image | grep "Linux version 5" | head -1)
          echo "$VERSION_FULL"
          echo "$VERSION_FULL" | grep -q "dirty" && { echo "❌ dirty!"; exit 1; } || true
          VERSION_CLEAN=$(echo "$VERSION_FULL" | sed 's/Linux version //' | sed 's/ (.*//')
          echo "✅ $VERSION_CLEAN"
          echo "KERNEL_VERSION=$VERSION_CLEAN" >> $GITHUB_ENV
          echo "$VERSION_CLEAN" > kernel_version.txt

      - name: "📦 Create variant ZIP"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          set -e
          DATE_TAG=$(date +'%Y%m%d')
          ZIP_NAME="AnyKernel3_${{ matrix.kernel.zip_prefix }}_${DATE_TAG}.zip"

          git clone --depth=1 https://github.com/superuseryu/AnyKernel3 ak3_tmp

          # put as "Image" so anykernel.sh flashes it directly
          cp out/dist/Image ak3_tmp/Image

          cd ak3_tmp
          zip -r9 "../$ZIP_NAME" * -x .git/*
          cd ..

          ZIP_SIZE_MB=$(echo "scale=2; $(stat -c%s "$ZIP_NAME") / 1024 / 1024" | bc)
          ZIP_SHA256=$(sha256sum "$ZIP_NAME" | cut -d' ' -f1)

          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          echo "ZIP_SIZE_MB=$ZIP_SIZE_MB" >> $GITHUB_ENV
          echo "ZIP_SHA256=$ZIP_SHA256" >> $GITHUB_ENV
          echo "DATE_TAG=$DATE_TAG" >> $GITHUB_ENV

          echo "✅ $ZIP_NAME ($ZIP_SIZE_MB MB)"

      - name: "📤 Upload variant artifact"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.kernel.artifact_name }}
          path: |
            ${{ env.WORK_DIR }}/${{ env.ZIP_NAME }}
            ${{ env.WORK_DIR }}/out/dist/kernel_version.txt
            ${{ env.WORK_DIR }}/wild_ksu_tag.txt
          retention-days: 1

  # package + release
  package-kernels:
    name: "📦 Package & Release"
    runs-on: ubuntu-latest
    needs: [setup, build-kernels]
    if: success()

    steps:
      - name: "📥 Download all kernel artifacts"
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts/

      - name: "🔖 Get versions"
        run: |
          # kernel version
          VERSION_FILE=$(find ./artifacts -name "kernel_version.txt" | head -1)
          KERNEL_VERSION=$([ -f "$VERSION_FILE" ] && cat "$VERSION_FILE" || echo "5.15.x")
          echo "KERNEL_VERSION=$KERNEL_VERSION" >> $GITHUB_ENV

          # SUSFS module version from sidex15/susfs4ksu-module latest tag
          SUSFS_VERSION=$(curl -sf https://api.github.com/repos/sidex15/susfs4ksu-module/tags \
            | jq -r '.[0].name' || echo "v1.5.2+_R26")
          echo "SUSFS_VERSION=$SUSFS_VERSION" >> $GITHUB_ENV
          echo "SUSFS_MODULE_URL=https://github.com/sidex15/susfs4ksu-module/releases/latest" >> $GITHUB_ENV

          # Wild KSU version — read from build artifact (set during build step)
          # fallback to GitHub API if not available
          WILD_VERSION=$(find ./artifacts -name "wild_ksu_tag.txt" | head -1 | xargs cat 2>/dev/null || \
            curl -sf https://api.github.com/repos/WildKernels/Wild_KSU/releases/latest \
            | jq -r '.tag_name' || echo "v3.1.1")
          echo "WILD_VERSION=$WILD_VERSION" >> $GITHUB_ENV

          # release tag
          DATE_TAG=$(date +'%Y%m%d')
          echo "DATE_TAG=$DATE_TAG" >> $GITHUB_ENV
          if [ "${{ inputs.is_testing }}" = "true" ]; then
            echo "RELEASE_TAG=${SUSFS_VERSION}-testing" >> $GITHUB_ENV
            echo "RELEASE_NAME=Wild KSU Kernel ${SUSFS_VERSION} — Testing" >> $GITHUB_ENV
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=${SUSFS_VERSION}" >> $GITHUB_ENV
            echo "RELEASE_NAME=Wild KSU Kernel ${SUSFS_VERSION}" >> $GITHUB_ENV
            echo "IS_PRERELEASE=false" >> $GITHUB_ENV
          fi

          echo "Kernel: $KERNEL_VERSION | SUSFS: $SUSFS_VERSION | Wild-KSU: $WILD_VERSION"

      - name: "🗂️ Collect ZIP files"
        run: |
          mkdir -p ./zips
          find ./artifacts -name "AnyKernel3_*.zip" -exec cp {} ./zips/ \;
          echo "📋 ZIPs:"
          ls -lh ./zips/

          # build zip list for env
          ZIP_LIST=$(ls ./zips/*.zip | tr '\n' ' ')
          echo "ZIP_LIST=$ZIP_LIST" >> $GITHUB_ENV

      - name: "🧹 Cleanup old release assets"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ env.RELEASE_TAG }}"
          # delete existing assets if release exists
          gh release view "$TAG" --repo ${{ github.repository }} --json assets \
            | jq -r '.assets[].name' \
            | while read asset; do
                gh release delete-asset "$TAG" "$asset" --repo ${{ github.repository }} --yes 2>/dev/null || true
              done
          echo "✅ Old assets cleaned"

      - name: "📝 Generate release body"
        run: |
          BODY=""
          if [ "${{ inputs.is_testing }}" = "true" ]; then
            BODY="> ⚠️ **Testing build** — use at your own risk."$'\n\n'
          fi
          BODY="${BODY}**Wild-KSU:** [${{ env.WILD_VERSION }}](https://github.com/WildKernels/Wild_KSU/releases/tag/${{ env.WILD_VERSION }})"$'\n'
          BODY="${BODY}**SUSFS:** [${{ env.SUSFS_VERSION }}](${{ env.SUSFS_MODULE_URL }})"$'\n\n'
          BODY="${BODY}**Features:** Wild-KSU ${{ env.WILD_VERSION }} (canary) · SUSFS ඞ ${{ env.SUSFS_VERSION }} · BBG · O3+LTO · some TCP algos (BBRv1, Westwood default)"$'\n\n'
          BODY="${BODY}**Flash via OrangeFox / TWRP** · [t.me/home_yu_chat](https://t.me/home_yu_chat)"
          echo "RELEASE_BODY<<EOF" >> $GITHUB_ENV
          echo "$BODY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: "⬆️ Create GitHub Release"
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: ./zips/*.zip
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          prerelease: ${{ env.IS_PRERELEASE }}
          body: ${{ env.RELEASE_BODY }}

      - name: "🎉 Send Telegram — Build success"
        if: success()
        run: |
          TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
          ENCODED_TAG=$(echo "${{ env.RELEASE_TAG }}" | sed 's/+/%2B/g')
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${ENCODED_TAG}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          BUILD_END=$(date +%s)
          DURATION=$(( BUILD_END - ${{ needs.setup.outputs.start_time }} ))

          if [ "${{ inputs.is_testing }}" = "true" ]; then
            BUILD_TYPE="🧪 Testing Build (LTO=thin)"
          else
            BUILD_TYPE="🧩 Stable Build (LTO=full)"
          fi

          MESSAGE="<b>🎉 Build Success!</b>%0A%0A"
          MESSAGE="${MESSAGE}<b>✏️ Type:</b> ${BUILD_TYPE}%0A"
          MESSAGE="${MESSAGE}<b>📱 Device:</b> Redmi Note 13 4G (sapphire/n)%0A"
          MESSAGE="${MESSAGE}<b>🏷️ Tag:</b> <code>${{ env.RELEASE_TAG }}</code>%0A"
          MESSAGE="${MESSAGE}<b>⏱️ Build Time:</b> $((DURATION / 60))m $((DURATION % 60))s%0A"
          MESSAGE="${MESSAGE}<b>🔗 Release:</b> <a href='${RELEASE_URL}'>Download</a>%0A"
          MESSAGE="${MESSAGE}<b>📝 Logs:</b> <a href='${RUN_URL}'>View</a>%0A%0A"
          MESSAGE="${MESSAGE}<b>⚡ Features:</b>%0A"
          MESSAGE="${MESSAGE}   • Wild-KSU ${{ env.WILD_VERSION }} (canary)%0A"
          MESSAGE="${MESSAGE}   • SUSFS ඞ ${{ env.SUSFS_VERSION }}%0A"
          MESSAGE="${MESSAGE}   • BBG (Baseband Guard)%0A"
          MESSAGE="${MESSAGE}   • O3 + LTO Optimization%0A"
          MESSAGE="${MESSAGE}   • TCP: BBRv1, Westwood, Vegas, Yeah, Veno%0A%0A"
          MESSAGE="${MESSAGE}<b>📦 Variants:</b>%0A"
          MESSAGE="${MESSAGE}   • GKI + Wild-KSU%0A"
          MESSAGE="${MESSAGE}   • CLO + Wild-KSU%0A"
          MESSAGE="${MESSAGE}   • GKI Vanilla%0A"
          MESSAGE="${MESSAGE}   • CLO Vanilla%0A%0A"
          MESSAGE="${MESSAGE}<b>📣 Maintainer:</b> @superuseryu%0A%0A"
          MESSAGE="${MESSAGE}#kernel #wildksu #gki #clo #sapphire #sapphiren"

          curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
            -d chat_id="$CHAT_ID" \
            -d text="$MESSAGE" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview=true

          # send each zip as document
          for ZIP in ./zips/*.zip; do
            [ -f "$ZIP" ] || continue
            SIZE_MB=$(echo "scale=2; $(stat -c%s "$ZIP") / 1024 / 1024" | bc)
            curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendDocument" \
              -F chat_id="$CHAT_ID" \
              -F document=@"$ZIP" \
              -F caption="📦 $(basename $ZIP) (${SIZE_MB} MB)" || true
          done

  # notify on failure
  notify-failure:
    name: "❌ Notify Failure"
    runs-on: ubuntu-latest
    needs: [build-kernels]
    if: always() && needs.build-kernels.result != 'success'
    steps:
      - name: "📣 Send Telegram — Build failed"
        run: |
          TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          JOB_STATUS="${{ needs.build-kernels.result }}"

          [ "$JOB_STATUS" = "cancelled" ] && ICON="⚠️" && TEXT="Workflow Cancelled" || \
          [ "$JOB_STATUS" = "failure" ] && ICON="❌" && TEXT="Build Failed" || \
          ICON="❓" && TEXT="Unknown ($JOB_STATUS)"

          MESSAGE="<b>${ICON} ${TEXT}!</b>%0A%0A"
          MESSAGE="${MESSAGE}<b>📱 Device:</b> Redmi Note 12/13 4G (sapphire/n)%0A"
          MESSAGE="${MESSAGE}<b>📦 Workflow:</b> Build Kernel - Sapphire/n%0A"
          MESSAGE="${MESSAGE}<b>🕐 Time:</b> $(TZ='Asia/Jakarta' date +'%H:%M:%S WIB')%0A"
          MESSAGE="${MESSAGE}<b>🔗 Logs:</b> <a href='${RUN_URL}'>View Logs</a>"

          curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
            -d chat_id="$CHAT_ID" \
            -d text="$MESSAGE" \
            -d parse_mode="HTML" || true
